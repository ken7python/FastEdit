name: Verify or package macOS DMG
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v0.2.0
permissions:
  contents: write
jobs:
  package:
    runs-on: macos-15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Verify the release disk image or create it from the released app
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          cd "$RUNNER_TEMP"
          base="FastEdit-${TAG#v}-macOS-arm64"
          gh release download "$TAG" -p SHA256SUMS.txt
          mkdir stage mounted
          if grep -Fq "  $base.dmg" SHA256SUMS.txt; then
            gh release download "$TAG" -p "$base.dmg"
            grep -F "  $base.dmg" SHA256SUMS.txt | shasum -a 256 -c -
            created=false
          else
            gh release download "$TAG" -p "$base.zip"
            grep -F "  $base.zip" SHA256SUMS.txt | shasum -a 256 -c -
            ditto -x -k "$base.zip" stage
            codesign --verify --deep --strict stage/FastEdit.app
            ln -s /Applications stage/Applications
            hdiutil create -format UDZO -fs HFS+ -volname FastEdit -srcfolder stage "$base.dmg"
            created=true
          fi
          hdiutil verify "$base.dmg"
          hdiutil attach -readonly -nobrowse -mountpoint "$PWD/mounted" "$base.dmg"
          codesign --verify --deep --strict mounted/FastEdit.app
          test -x mounted/FastEdit.app/Contents/MacOS/FastEdit
          mounted/FastEdit.app/Contents/MacOS/ffprobe -version
          test "$(readlink mounted/Applications)" = /Applications
          hdiutil detach "$PWD/mounted"
          if "$created"; then
            shasum -a 256 "$base.dmg" >> SHA256SUMS.txt
            gh release upload "$TAG" "$base.dmg" SHA256SUMS.txt --clobber
          fi
